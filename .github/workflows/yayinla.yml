name: Önizlemeyi yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Eski siteden görselleri indir (eksikse)
        run: bash scripts/gorselleri-indir.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Statik önizlemeyi ve WordPress temasını üret
        run: BASE="/${GITHUB_REPOSITORY#*/}/" python3 src/build.py
      - name: Görselleri ve güncel temayı depoya yaz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets-img wordpress
          git diff --cached --quiet || { git commit -m "Görseller ve WordPress teması güncellendi [skip ci]"; git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
